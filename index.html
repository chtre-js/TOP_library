<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <script src="./script.js" defer></script>
    <title>Library</title>
  </head>
  <body>
    <header>
      <div class="top-bar">
        <div class="logo">
          <p>Library</p>
        </div>
        <div>
          <button class="header__cta">+ Add New Book</button>
        </div>
      </div>
    </header>
    <div class="grid">
        <div class="grid__card">
            <div class="card__header">
                <p class="book__title">Title</p>
                <div class="card__readStatus">Unread</div>
                <p class="book__author">Author</p>
            </div>
            <img src="./assets/placeholder.svg">
            <div class="book__pages">
                <p>Pages</p>
            </div>
        </div>
    </div>
  </body>
</html>
