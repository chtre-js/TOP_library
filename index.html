<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <script src="./script.js" defer></script>
    <title>Library</title>
  </head>
  <body>
    <header>
      <div class="top-bar">
        <div class="logo">
          <p>Library</p>
        </div>
        <div>
          <button class="header__cta">+ Add New Book</button>
        </div>
      </div>
      <dialog id="form" open="open">
        <div class="form__wrap">
          <form>
            <div class="inputs__wrap">
              <div>
                <label for="title">Title</label>
                <input id="title" name="title" type="text" />
              </div>
              <div>
                <label for="author">Author</label>
                <input id="author" name="author" type="text" />
              </div>
              <div>
                <label for="pages">Pages</label>
                <input id="pages" name="pages" type="number" />
              </div>
              <div class="checkbox__container">
                <label for="readStatus">Have you read it ?</label>
                <input id="readStatus" name="readStatus" type="checkbox" />
              </div>
            </div>
            <div class="form-btn__wrap">
              <button id="form-trigger" class="header__cta">Add to Collection</button>
            </div>
          </form>
        </div>
      </dialog>
    </header>
    <div class="grid">
      <template id="cardTemplate">
        <div class="card__header">
          <p class="card__title">Title</p>
          <div class="card__readStatus">Unread</div>
          <p class="card__author">Author</p>
        </div>
        <img class="card__img" src="./assets/placeholder.svg" />
        <div class="card__footer">
          <div class="card__pages">
            <img class="card__pages-icon" src="./assets/icons/book_pages.svg" />
            <p>500</p>
            <p>pages</p>
          </div>
          <button class="card__remove-btn"></button>
        </div>
      </template>
    </div>
  </body>
</html>
